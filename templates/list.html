<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectBIG6 | 履修リスト</title>
  <link rel="stylesheet" href="./list.css">
  <script src="./src/list-data.js" defer></script>
  <script src="./src/list.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <!-- 上部バー：表示切替・送信・読込・学年 -->
    <header class="topbar">
      <nav class="view-tabs" role="tablist">
        <button class="view-tab is-active" role="tab" aria-selected="true" data-view="A">表示A</button>
        <button class="view-tab" role="tab" aria-selected="false" data-view="B">表示B</button>
        <button class="view-tab" role="tab" aria-selected="false" data-stub="表示C">表示C</button>
      </nav>
      <div class="topbar-actions">
        <button class="pill" data-stub="送信">送信</button>
        <button class="pill" data-stub="PDF読み込み">PDF読込</button>
        <button class="pill" data-stub="Excel読み込み">Excel読込</button>
        <select id="grade" class="grade-select" aria-label="学年">
          <option value="1">1年</option>
          <option value="2">2年</option>
          <option value="3" selected>3年</option>
          <option value="4">4年</option>
        </select>
        <button class="sidebar-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="false" title="卒業判定を表示">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <rect x="12" y="3" width="6" height="14" rx="1" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 表示B：既存の時間割画面（index.html）をそのまま埋め込む -->
    <iframe class="view-b" id="viewB" title="表示B 時間割" hidden></iframe>

    <!-- 表示A：成績表風リスト -->
    <section class="pane pane-sheet">
      <div class="sheet-toolbar">
        <input type="search" id="search" placeholder="科目名で検索">
        <select id="deptFilter" aria-label="部門">
          <option value="">すべての部門</option>
        </select>
        <select id="progHighlight" aria-label="プログラム">
          <option value="">プログラム指定：なし</option>
          <option value="PC">PC</option>
          <option value="DE">DE</option>
          <option value="HM">HM</option>
          <option value="NS">NS</option>
        </select>
        <label class="check"><input type="checkbox" id="onlyPlanned"> 予定のみ</label>
        <span class="sheet-total" id="sheetTotal"></span>
      </div>
      <div class="sheet-scroll" id="sheetScroll">
        <table class="sheet" id="sheet">
          <thead>
            <tr>
              <th rowspan="2" class="c-name">授業科目名</th>
              <th colspan="3">単位数</th>
              <th colspan="4">プログラム指定</th>
              <th colspan="2">1年</th>
              <th colspan="2">2年</th>
              <th colspan="2">3年</th>
              <th colspan="2">4年</th>
            </tr>
            <tr>
              <th class="c-num">必修</th><th class="c-num">選必</th><th class="c-num">選択</th>
              <th class="c-prog">PC</th><th class="c-prog">DE</th><th class="c-prog">HM</th><th class="c-prog">NS</th>
              <th class="c-term" data-term="1前">前</th><th class="c-term" data-term="1後">後</th>
              <th class="c-term" data-term="2前">前</th><th class="c-term" data-term="2後">後</th>
              <th class="c-term" data-term="3前">前</th><th class="c-term" data-term="3後">後</th>
              <th class="c-term" data-term="4前">前</th><th class="c-term" data-term="4後">後</th>
            </tr>
          </thead>
          <tbody id="sheetBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 右上ボタンで開く卒業判定サイドバー -->
    <aside class="sidebar" id="sidebar" hidden aria-label="卒業判定">
      <div class="sidebar-head">
        <h2>卒業判定</h2>
        <button class="sidebar-close" id="sidebarClose" aria-label="閉じる">×</button>
      </div>
      <table class="year-table" id="yearTable"></table>
      <div id="progList"></div>
      <p class="sidebar-note">※ 表示Aで「履」を付けた科目だけで計算します（成績は見ていません）</p>
    </aside>
  </div>

  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" hidden></div>
</body>
</html>
